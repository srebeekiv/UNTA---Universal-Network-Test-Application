name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK to Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bn=${{ github.run_number }}
          ver="$((bn / 10)).$((bn % 10))"
          cp app/build/outputs/apk/release/app-release.apk "UNTA-${ver}.apk"
          {
            echo "Версия **${ver}** (сборка ${bn})."
            echo
            echo "### Что нового"
            git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session)' || true
          } > notes.md
          gh release create "build-${bn}" "UNTA-${ver}.apk" --title "UNTA ${ver}" --notes-file notes.md

      - name: Save build log to ci-log branch
        if: failure()
        run: |
          mkdir -p /tmp/cilog
          { grep -nE "^e: |error:|FAILURE|What went wrong|Execution failed|Caused by" -A4 build.log | head -150; echo; echo ===== TAIL =====; tail -n 120 build.log; } > /tmp/cilog/build.log 2>&1 || echo "no log" > /tmp/cilog/build.log
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git checkout -q --orphan ci-log
          git rm -rfq . || true
          cp /tmp/cilog/build.log build.log
          git add build.log
          git commit -qm "build log ${{ github.run_number }}"
          git push -qf origin ci-log
